<!DOCTYPE html>
<html lang="en">

<head>

    <!-- metas -->
    <meta charset="utf-8">
    <meta name="author" content="Website Design Templates">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="Restaurant & Cafe HTML Template">
    <meta name="description" content="Cafino - Restaurant & Cafe HTML Template">

    <!-- title  -->
    <title>Cafino - Restaurant & Cafe HTML Template</title>

    <!-- favicon -->
    <link rel="shortcut icon" href="img/logos/favicon.png">
    <link rel="apple-touch-icon" href="img/logos/apple-touch-icon-57x57.png">
    <link rel="apple-touch-icon" sizes="72x72" href="img/logos/apple-touch-icon-72x72.png">
    <link rel="apple-touch-icon" sizes="114x114" href="img/logos/apple-touch-icon-114x114.png">

    <!-- plugins -->
    <link rel="stylesheet" href="css/plugins.css">

    <!-- quform css -->
    <link rel="stylesheet" href="quform/css/base.css">

    <!-- scroll -->
    <link rel="stylesheet" href="css/scrollbar.css">

    <!-- theme core css -->
    <link href="css/styles.css" rel="stylesheet">

</head>

<body>

    <!-- PAGE LOADING
    ================================================== -->
    <div id="preloader"></div>

    <!-- MAIN WRAPPER
    ================================================== -->
    <div class="main-wrapper">

        <!-- COMING-SOON PAGE
        ================================================== -->
        <div class="d-flex align-items-center position-relative min-vh-100 bg-img cover-background" data-overlay-dark="65" data-background="img/bg/bg-08.jpg">
            <div class="container">
                <div class="row align-items-center justify-content-center">
                    <div class="col-lg-8">
                        <div class="text-center">
                            <div class="mb-2-9 text-center wow fadeIn" data-wow-delay="100ms">
                                <span class="d-block text-secondary alt-font small-title">Our New Website is</span>
                                <h2 class="mb-0 display-4 font-weight-700 text-uppercase text-center w-xxl-80 mx-auto text-white">Coming Soon</h2>
                            </div>
                            <div class="coming-soon">
                                <ul class="countdown text-center mb-1-9 mb-md-2-9 mt-n2">
                                    <!-- start days -->
                                    <li class="mt-2"><span class="days">30</span>
                                        <p class="timeRefDays text-center">days</p>
                                    </li>
                                    <!-- end days -->
                                    <!-- start hours -->
                                    <li class="mt-2"><span class="hours">10</span>
                                        <p class="timeRefHours">hours</p>
                                    </li>
                                    <!-- end hours -->
                                    <!-- start minutes -->
                                    <li class="mt-2"><span class="minutes">50</span>
                                        <p class="timeRefMinutes">minutes</p>
                                    </li>
                                    <!-- end minutes -->
                                    <!-- start seconds -->
                                    <li class="mt-2"><span class="seconds">10</span>
                                        <p class="timeRefSeconds">seconds</p>
                                    </li>
                                    <!-- end seconds -->
                                </ul>
                            </div>
                            <div>
                                <ul class="social-icon-style2 ps-0">
                                    <li><a href="coming-soon.html#"><i class="ti-facebook"></i></a></li>
                                    <li><a href="coming-soon.html#"><i class="ti-twitter-alt"></i></a></li>
                                    <li><a href="coming-soon.html#"><i class="ti-instagram"></i></a></li>
                                    <li><a href="coming-soon.html#"><i class="ti-linkedin"></i></a></li>
                                    <li><a href="coming-soon.html#"><i class="ti-dribbble"></i></a></li>
                                </ul>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- BUY THEME
    ================================================== -->
<!-- SCROLL TO TOP
    ================================================== -->
    <div class="scroll-top-percentage"><span id="scroll-value"></span></div>

    <!-- all js include start -->

    <!-- jQuery -->
    <script src="js/jquery.min.js"></script>

    <!-- popper js -->
    <script src="js/popper.min.js"></script>

    <!-- bootstrap -->
    <script src="js/bootstrap.min.js"></script>

    <!-- scroll -->
    <script src="js/jquery.scrollbar.min.js"></script>

    <!-- jquery -->
    <script src="js/core.min.js"></script>

    <!-- custom scripts -->
    <script src="js/main.js"></script>

    <!-- form plugins js -->
    <script src="quform/js/plugins.js"></script>

    <!-- form scripts js -->
    <script src="quform/js/scripts.js"></script>

    <!-- all js include end -->

</body>

</html>
